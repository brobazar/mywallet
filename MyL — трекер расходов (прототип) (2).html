<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:16px 14px 84px}

.bal small{opacity:.85}.bal b{font-size:30px;display:block}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chip{border-radius:999px;padding:5px 11px;background:var(--ac2);color:var(--ink);border:1px solid var(--line);font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px}
.btn.ghost{background:var(--ac2);color:var(--ink)}
.bar{height:8px;border-radius:8px;background:var(--ac2);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:13px}.neg{color:var(--bad)}.pos{color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.ad{display:flex;gap:10px}.av{width:40px;height:40px;border-radius:50%;background:var(--ac2);display:grid;place-items:center;font-size:20px;flex:none}
video{width:100%;border-radius:14px;background:#000;max-height:260px}
.cardw{border-radius:14px;padding:12px;color:#fff;background:linear-gradient(135deg,#2f6b45,#7bc08f);margin-bottom:8px}
.note{border:1px dashed var(--ac);background:var(--ac2);border-radius:12px;padding:8px;font-size:12px;margin-top:8px}
.ic{width:22px;height:22px;display:block}nav span .ic{margin:0 auto 2px;width:24px;height:24px}nav button.on .ic{animation:pop .45s;filter:drop-shadow(0 2px 4px color-mix(in srgb,var(--ac) 45%,transparent))}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--ac2);color:var(--ac);margin-right:8px;vertical-align:middle}.ib .ic{width:18px;height:18px}h1 .ib{width:36px;height:36px}h1 .ib .ic{width:22px;height:22px}@keyframes fl{50%{transform:translateY(-3px)}}.av{background:none}.av svg{animation:fl 3s ease-in-out infinite}.vf{position:relative;height:150px;border-radius:16px;border:2px solid var(--ac);margin:8px 0 12px;overflow:hidden;background:var(--ac2)}.vf i{position:absolute;left:8%;right:8%;height:2px;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:sc 2s ease-in-out infinite alternate}@keyframes sc{from{top:12%}to{top:88%}}.pill u{animation:pl 1.6s infinite}@keyframes pl{50%{transform:scale(1.25)}}.card{transition:transform .15s}.card:active{transform:scale(.99)}.pick{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.pk{flex:none;width:72px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 2px;display:grid;justify-items:center}.pk small{font-size:10px;text-align:center}.pk.on{border-color:var(--ac);background:var(--ac2)}.stage{position:relative;height:250px}.stage:before{content:"";position:absolute;left:24%;right:24%;top:28%;bottom:28%;border-radius:50%;background:#b98b5e;box-shadow:inset 0 -8px #9a6f46}.st{position:absolute;transform:translate(-50%,-50%)}.st.tk{animation:bn .5s infinite}@keyframes bn{50%{margin-top:-7px}}.st svg,.bb svg{shape-rendering:crispEdges}.bb{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin:6px 0;animation:pop .3s}.st2{flex-direction:column;align-items:stretch;justify-content:center;color:#fff;z-index:40;padding:20px;text-align:center}.pb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;gap:4px}.pb i{flex:1;height:3px;border-radius:3px;background:#fff5}.pb i.on{background:#fff}.sc{font-size:22px;animation:pop .4s}.sc big{display:block;font-size:44px;font-weight:800;margin:10px 0}.bdg{display:inline-block;margin:4px;padding:8px 12px;border-radius:999px;background:#ffffff30}textarea{font:inherit;width:100%;min-height:90px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.chip{min-height:40px;display:inline-flex;align-items:center}.x{border:0;background:none;color:var(--mut);padding:8px;min-width:40px;min-height:40px}.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:10}.sh{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:20}.sp{background:var(--card);width:100%;max-width:430px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}.cc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:6px 6px 6px 14px;border-radius:14px;z-index:30;font-size:13px;white-space:nowrap}.tt button{border:0;background:none;color:var(--bg);font-weight:700;padding:8px 10px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div id="app"></div>

const ib=k=>`<i class="ib">${IC[k]||IC.other}</i>`;
const av=(a,b,n,x)=>`<svg viewBox="0 0 40 40" width="40" height="40"><defs><linearGradient id="g${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><circle cx="20" cy="20" r="20" fill="url(#g${n})"/><circle cx="14.5" cy="18" r="1.8" fill="#fff"/><circle cx="25.5" cy="18" r="1.8" fill="#fff"/><path d="M14 25q6 5 12 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>${x}</svg>`;
const AVS=[av('#4f9d69','#2f6b45',0,'<circle cx="14.5" cy="18" r="4.5" fill="none" stroke="#fff" stroke-width="1.2"/><circle cx="25.5" cy="18" r="4.5" fill="none" stroke="#fff" stroke-width="1.2"/>'),av('#e0a458','#c9783a',1,'<path d="M9 13q11-9 22 0z" fill="#fff" opacity=".9"/>'),av('#9b8ad6','#6e5fb0',2,'<path d="M20 5c4 0 6 3 6 6-4 0-6-2-6-6z" fill="#fff" opacity=".9"/>')];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RE=['Accountant','Deal hunter','Gentle coach'];
const AN={};let AK='food',AI_=0,ST=null,CAMON=0,UN=null;
function toast(m,f){UN=f;const e=document.getElementById('toast');e.innerHTML=esc(m)+(f?` <button onclick="UN&&UN();hideT()">${t('undo')}</button>`:'');e.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(hideT,4000)}
function hideT(){document.getElementById('toast').style.display='none'}
function del(j){const x=S.tx.splice(j,1)[0];render();toast(t('del'),()=>{S.tx.splice(j,0,x);render()})}
function openAdd(ti){AK='food';AI_=0;document.getElementById('sheet').innerHTML=`<div class="sh" onclick="if(event.target==this)closeAdd()"><div class="sp"><div class="row"><b>${t('addTx')}</b><span class="chip on" onclick="AI_=!AI_;this.textContent=t(AI_?'income':'expense')">${t('expense')}</span></div><input id="fa" type="number" inputmode="decimal" placeholder="${t('amt')} (${CUR[S.cur][0]})" style="margin-top:10px"><input id="ft" value="${esc(ti||'')}" placeholder="${t('what')}" style="margin-top:8px"><div class="cc">${CATS.map(([k])=>`<span class="chip${k=='food'?' on':''}" onclick="AK='${k}';document.querySelectorAll('.cc .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${t(k)}</span>`).join('')}</div><button class="btn" style="width:100%" onclick="saveAdd()">${t('save')}</button></div></div>`;setTimeout(()=>document.getElementById('fa').focus(),60)}
const BASE=['....HHHH....','...HHHHHH...','..SSSSSSSS..','..SESSSSES..','..SSSSSSSS..','...SSMMSS...','....SSSS....','..BBBBBBBB..','.BBBBBBBBBB.','..BBBBBBBB..','...BB..BB...','...SS..SS...'];
function spr(o,z){let r='';BASE.forEach((w,y)=>[...w].forEach((c,x)=>{let f={H:o.h,S:o.c,B:o.b,E:'#222',M:'#b33'}[c];if(o.e&&y==1&&(x==2||x==9))f=o.c;if(o.x&&y==0&&(x==2||x==9))f='#eee';if(o.g&&y==3&&c=='S')f='#fff';if(f)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`}));return`<svg viewBox="0 0 12 12" width="${z}" height="${z}">${r}</svg>`}
const CH=[{n:'Бобёр Борис',c:'#a0673a',b:'#4f9d69',h:'#7a4a22',e:1,p:'строгий бухгалтер, обожает экономить',f:'Каждую мелочь в таблицу!'},{n:'Тётя Люся',c:'#f1c9a5',b:'#c97b9a',h:'#ddd',g:1,p:'бабушка, «в наше время», всё готовит сама',f:'В наше время борщ делали сами!'},{n:'Кот Бюджетик',c:'#e0a458',b:'#6e8fd6',h:'#c9783a',e:1,p:'ленивый кот, «живём один раз», любит вкусное',f:'Живём один раз, мяу!'},{n:'Сэр Лимон',c:'#f6e27a',b:'#8892a6',h:'#b8c0d0',p:'надменный рыцарь, правила и честь',f:'Честь кошелька прежде всего!'},{n:'Дракон Гоша',c:'#5aa86a',b:'#2f6b45',h:'#2f6b45',x:1,p:'дракон, копит сокровища, жадный',f:'Моё! Не тратить!'},{n:'Ниндзя Ёши',c:'#f1c9a5',b:'#333',h:'#222',p:'молчаливый минималист, коротко',f:'Меньше вещей.'},{n:'Робот Р-0',c:'#9fb4c7',b:'#5d7a93',h:'#eee',g:1,p:'робот, только проценты и логика',f:'Расходы превышают оптимум на 12%.'},{n:'Принцесса Пикси',c:'#f6d3b8',b:'#e07aa8',h:'#f2c230',p:'сказочная принцесса, надеется на чудо',f:'Красота тоже важна!'},{n:'Пират Билли',c:'#d9a273',b:'#b33a3a',h:'#222',g:1,p:'пират, ищет скидки как клад',f:'Ищу скидку, арр!'},{n:'Фея Мята',c:'#cdeccf',b:'#3fb59a',h:'#8fd3c0',e:1,p:'нежный коуч, без давления',f:'Ты молодец, шаг за шагом.'}];
let SEAT=[0,1,2],TB=0;
function seat(i){const k=SEAT.indexOf(i);if(k>=0){if(SEAT.length>2)SEAT.splice(k,1)}else if(SEAT.length<5)SEAT.push(i);render()}
function tableHTML(){const r=S.lang=='ru';return`<h1>${ib("ai")}${t("ai")}</h1><p class="mut">${r?'Кто сидит за столом (2–5):':'Who sits at the table (2–5):'}</p><div class="pick">${CH.map((o,i)=>`<button class="pk${SEAT.includes(i)?' on':''}" onclick="seat(${i})">${spr(o,40)}<small>${o.n}</small></button>`).join('')}</div><input id="q" placeholder="${r?'Вопрос столу (необязательно)':'Question (optional)'}"><button class="btn" style="width:100%;margin:10px 0" onclick="talk()">${r?'Собрать стол':'Start the round table'}</button><div class="stage">${SEAT.map((s,k)=>{const a=k/SEAT.length*6.283-1.57;return`<div class="st" id="s${s}" style="left:${50+43*Math.cos(a)}%;top:${50+42*Math.sin(a)}%">${spr(CH[s],46)}</div>`}).join('')}</div><div id="log"></div>`}

async function cam(){if(CAMON)return;const v=document.getElementById('v');try{ST=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});CAMON=1;v.srcObject=ST;v.style.display='block';await v.play();const bd='BarcodeDetector'in window?new BarcodeDetector():null,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});const tick=async()=>{if(!CAMON||!v.isConnected)return stopCam();let r=null;try{if(bd){const b=await bd.detect(v);if(b.length)r=b[0].rawValue}else if(window.jsQR&&v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(q)r=q.data}}catch(e){}if(r){stopCam();LC=r;out(`✅ <code>${esc(r)}</code><br><button class="btn" style="margin-top:8px" data-c="${esc(r).slice(0,60)}" onclick="openAdd(this.dataset.c)">＋ ${t("addB")}</button>`);return}setTimeout(()=>requestAnimationFrame(tick),bd?0:120)};tick()}catch(e){stopCam();out(t('nocam'))}}

 const d=new BarcodeDetector();const tick=async()=>{if(!v.isConnected)return;try{const b=await d.detect(v);if(b.length){out(`✅ ${b[0].format}: <code>${b[0].rawValue}</code>`);st.getTracks().forEach(x=>x.stop());v.style.display="none";return}}catch(e){}requestAnimationFrame(tick)};tick()}catch(e){out("Камера недоступна (разрешение/браузер). Нажми «Демо».")}}
